<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="600" y="70" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">Customer Churn Distribution</text>

  <rect x="250" y="140" width="250" height="300" rx="18" fill="#dbeafe"/>
  <rect x="700" y="140" width="250" height="300" rx="18" fill="#d1fae5"/>

  <text x="375" y="190" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1e3a8a">Churn</text>
  <text x="825" y="190" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#166534">Retained</text>

  <circle cx="375" cy="340" r="90" fill="#60a5fa" opacity="0.25"/>
  <circle cx="825" cy="340" r="90" fill="#34d399" opacity="0.25"/>

  <text x="375" y="350" font-family="Arial, sans-serif" font-size="54" font-weight="700" text-anchor="middle" fill="#1d4ed8">26.5%</text>
  <text x="825" y="350" font-family="Arial, sans-serif" font-size="54" font-weight="700" text-anchor="middle" fill="#15803d">73.5%</text>

  <text x="375" y="430" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1f2937">At-risk customers</text>
  <text x="825" y="430" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1f2937">Active customers</text>

  <line x1="180" y1="520" x2="1020" y2="520" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#475569">Key observation: churn is concentrated in short tenure, month-to-month, and high-charge segments.</text>
</svg>
